[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ut-rbv"
version = "0.1.0"
description = "Alat Pengunduh E-Book Ruang Baca Virtual (RBV) Universitas Terbuka ke PDF"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Developer" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion"
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "cachetools>=5.3.0",
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
    "click>=8.1.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0"
]

[project.scripts]
ut-rbv = "ut_rbv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
